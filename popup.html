<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 220px;
      background: #1a1b2e;
      color: #c8c9e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      padding: 14px;
    }
    h1 {
      font-size: 13px;
      font-weight: 600;
      color: #9b9fcc;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }
    .info {
      font-size: 11px;
      color: #5a5e98;
      line-height: 1.6;
    }
    .link {
      display: block;
      margin-top: 12px;
      color: #6366f1;
      text-decoration: none;
      font-size: 11px;
    }
    .link:hover { text-decoration: underline; }

</head>
<body>
  <h1>Claude Code Monitor</h1>
  <p class="info">
    claude.ai を開くと、右下に使用状況のオーバーレイが表示されます。

  <a class="link" href="https://claude.ai/code" target="_blank">Claude Code を開く →</a>

</html>
