<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Claude Code Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 580px;
      background: #0d0e1f;
      color: #c8c9e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
    }

    /* ── Header ── */
    .hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid #1a1c38;
    }
    .hdr img { width: 22px; height: 22px; border-radius: 5px; }
    .hdr-title {
      flex: 1;
      font-size: 13px;
      font-weight: 700;
      color: #e0e1ff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .clear-btn {
      background: none;
      border: 1px solid #252748;
      border-radius: 5px;
      color: #4a4e80;
      font-size: 11px;
      padding: 3px 9px;
      cursor: pointer;
    }
    .clear-btn:hover { color: #9b9fcc; border-color: #4a4e80; }

    /* ── Legend ── */
    .legend {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 10px 22px 6px;
      font-size: 11px;
      color: #6b6f9a;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .leg-line { width: 22px; height: 3px; border-radius: 2px; }
    .leg-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── Canvas ── */
    #chart {
      display: block;
      margin: 4px 20px 0;
      border-radius: 8px;
    }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      margin: 12px 20px 16px;
      border: 1px solid #1a1c38;
      border-radius: 8px;
      overflow: hidden;
    }
    .stat-cell {
      padding: 10px 8px;
      text-align: center;
      background: #111226;
    }
    .stat-cell + .stat-cell { border-left: 1px solid #1a1c38; }
    .stat-lbl {
      font-size: 9px;
      color: #3a3e68;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }
    .stat-val {
      font-size: 17px;
      font-weight: 700;
      color: #e0e1ff;
    }
    .stat-val.orange { color: #FF6B35; }
    .stat-val.indigo { color: #818cf8; }
    .stat-val.sm     { font-size: 12px; }
  </style>
</head>
<body>
  <div class="hdr">
    <img src="icons/icon48.png" alt="">
    <span class="hdr-title">Claude Code Monitor</span>
    <button class="clear-btn" id="clear-btn">履歴をクリア</button>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="leg-line" style="background:#FF6B35"></div>
      セッション
    </div>
    <div class="legend-item">
      <div class="leg-line" style="background:#4f46e5"></div>
      週間制限
    </div>
    <div class="legend-item">
      <div class="leg-dot" style="background:#FF6B35;box-shadow:0 0 5px #FF6B3588"></div>
      スパイク
    </div>
    <div class="legend-item" id="model-legend" style="display:none">
      <div class="leg-dot" id="model-dot"></div>
      <span id="model-name-leg"></span>
    </div>
  </div>

  <canvas id="chart" width="540" height="250"></canvas>

  <div class="stats">
    <div class="stat-cell">
      <div class="stat-lbl">セッション</div>
      <div class="stat-val orange" id="stat-session">--%</div>
    </div>
    <div class="stat-cell">
      <div class="stat-lbl">週間制限</div>
      <div class="stat-val indigo" id="stat-weekly">--%</div>
    </div>
    <div class="stat-cell">
      <div class="stat-lbl">使用モデル</div>
      <div class="stat-val sm" id="stat-model" style="color:#6b6f9a">--</div>
    </div>
    <div class="stat-cell">
      <div class="stat-lbl">最大スパイク</div>
      <div class="stat-val sm orange" id="stat-spike">--</div>
    </div>
    <div class="stat-cell">
      <div class="stat-lbl">最終更新</div>
      <div class="stat-val sm" style="color:#6b6f9a" id="stat-update">--</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
